<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your iWanPass password</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f3f6f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #dce4e7;border-radius:12px;">
      <tr>
        <td style="padding:32px;">
          <p style="margin:0 0 24px;color:#087f65;font-size:23px;font-weight:700;">iWanPass</p>
          <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Reset your password</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">We received a request to reset your iWanPass password. Use the button below to choose a new one.</p>
          <p style="margin:0 0 24px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;border-radius:8px;background:#087f65;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;">Reset password</a>
          </p>
          <p style="margin:0;color:#4b5563;font-size:14px;line-height:1.5;">If you did not request this, you can ignore this email. Your password will stay the same.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
